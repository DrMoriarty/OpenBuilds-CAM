name: Lint & Test

# CI-проверка на каждый push в master и на все pull request'ы:
# - статические проверки из задачи уровня 1: npm run check / lint / check-html;
# - юнит-тесты на встроенном node:test (npm test, ноль зависимостей);
# - Playwright smoke-тесты: приложение открывается в headless Chromium по
#   HTTP (не file:// — Web Workers и root-absolute importScripts требуют
#   настоящий сервер, см. AGENTS.md), проверяется чистый старт без ошибок
#   консоли/страницы и загрузка workspace/*.obc.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    name: Check, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Задача уровня 1: базовая валидация --------------------------------
      - name: Syntax check (node --check over js/, workers/, electron/)
        run: npm run check

      - name: ESLint correctness gate
        run: npm run lint

      - name: index.html script integrity check
        run: npm run check-html

      # --- Задача уровня 2: тесты ---------------------------------------------
      - name: Unit tests (node:test)
        run: npm test

      # Playwright: пакет уже в devDependencies, скачиваем только браузер
      # (+ системные зависимости для headless Chromium на ubuntu).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      # HTML-отчёт Playwright пригодится при разборе упавших смоуков.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
